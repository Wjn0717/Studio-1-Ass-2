<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JinniWei-digital media assignment 2</title>
<style>
body{
margin:0;
min-height:100vh;
background-color: #f7f4ef;
}
.row{
width:960px;
margin:15px auto 15px auto;
display: table;
}
.image-container {
display: table-cell;
vertical-align: middle;
padding:10px;
}
.image-item{
position:relative;
width:300px;
height:300px;
cursor: pointer;
transition: transform 0.22s ease-out;
}
.image-item:hover{
transform: scale(1.06);
}
.image-item img{
position:absolute;
top:0;
left:0;
width:300px;
height:300px;
object-fit: cover;
}
.hover-img{
opacity:0;
pointer-events:none;
}
.image-item:hover .hover-img{
opacity:1;
}
.image-item:hover .normal-img{
opacity:0;
}
</style>
</head>
<body>
<div class="row">
<div class="image-container">
<div class="image-item">
<img class="normal-img" src="nine icons-01.png" onclick="new Audio('sound/01.mp3').play()"/>
<img class="hover-img" src="01-hover.png"/>
</div>
</div>
